[package]
name = "calendar-server"
version = "0.1.0"
edition = "2024"
default-run = "calendar-server"

[[bin]]
name = "calendar"
path = "api/calendar.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "macros", "migrate", "json"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
utoipa-swagger-ui = { version = "9", default-features = false, features = ["axum", "vendored"] }
uuid = { version = "1", features = ["serde", "v4"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

