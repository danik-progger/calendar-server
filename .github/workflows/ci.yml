name: Backend CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - run: cargo fmt --check
      - name: Type check all targets
        run: cargo check --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install openapi-spec-validator==0.7.2
          openapi-spec-validator openapi.yaml

  integration:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://calendar:ci-only@127.0.0.1:5432/calendar
    steps:
      - uses: actions/checkout@v6
      - name: Start disposable test database
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE calendar WITH LOGIN CREATEDB PASSWORD 'ci-only'"
          sudo -u postgres createdb -O calendar calendar
      - run: rustup show
      - run: cargo test --locked
